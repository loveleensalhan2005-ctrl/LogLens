<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LogLens Security Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 25px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        #exportButton {
            background: #16a34a;
        }

        input[type="file"] {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #uploadStatus {
            margin-top: 10px;
            font-weight: bold;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .section {
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        #attackTimeline,
        #topAttackers {
            margin-top: 15px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 6px;
        }

        #attackChart {
            max-height: 350px;
        }

        /* =========================
           GEO MAP
           ========================= */

        #geoMap {
            margin-top: 15px;
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #f9fafb;
        }

        #attackMap {
            width: 100%;
            height: 450px;
        }

    </style>

</head>


<body>


<header>

    <h1>LogLens</h1>

    <p>Security Log Analysis Dashboard</p>

</header>


<div class="container">


    <!-- FILE CONTROLS -->

    <div class="controls">

        <h2>Log File Analysis</h2>

        <button onclick="loadDemoLog()">
            Load Demo Log
        </button>

        <br>

        <input
            type="file"
            id="logFile"
            accept=".log"
        >

        <button onclick="uploadLogFile()">
            Upload & Analyze Log
        </button>

        <button
            id="exportButton"
            onclick="exportReport()"
            disabled
        >
            Export Report
        </button>

        <div id="uploadStatus"></div>

    </div>


    <!-- SUMMARY CARDS -->

    <div class="cards">

        <div class="card">

            <h3>Total Requests</h3>

            <p id="totalRequests">0</p>

        </div>


        <div class="card">

            <h3>Total Attacks</h3>

            <p id="totalAttacks">0</p>

        </div>


        <div class="card">

            <h3>Top Attacker</h3>

            <p id="topAttacker">-</p>

        </div>

    </div>


    <!-- ATTACK TIMELINE -->

    <div class="section">

        <h2>Attacks per Hour</h2>

        <div id="attackTimeline">

            <canvas id="attackChart"></canvas>

        </div>

    </div>


    <!-- TOP ATTACKERS -->

    <div class="section">

        <h2>Top Attackers</h2>

        <div id="topAttackers">

            Data will appear here.

        </div>

    </div>


    <!-- GEO MAP -->

    <div class="section">

        <h2>Attacking IP Geo-Map</h2>

        <div id="geoMap">

            <div id="attackMap"></div>

        </div>

    </div>


</div>


<script src="dashboard.js"></script>

</body>

</html>
